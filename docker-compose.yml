# ---------------------------------------------------------------------------
# AutoMail — single-host deployment.
#
#   docker compose up -d --build
#
# The app listens on 127.0.0.1:3000 by default so it is only reachable through
# the Nginx reverse proxy on the host. Drop the `127.0.0.1:` prefix only if you
# intend to expose the app directly.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: automail:latest
    container_name: automail
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Absolute path inside the container, on the persistent volume below.
      DATABASE_URL: file:/app/data/automail.db
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      # Named volume keeps the SQLite file across image rebuilds.
      - automail-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  automail-data:
    driver: local
