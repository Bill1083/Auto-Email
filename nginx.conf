# ---------------------------------------------------------------------------
# AutoMail — Nginx reverse proxy
#
# Install to:  /etc/nginx/sites-available/automail
# Enable with: ln -s /etc/nginx/sites-available/automail /etc/nginx/sites-enabled/
#
# Deploy in two passes:
#   1. Start with ONLY the port 80 server block below (comment out the 443 one)
#      so Certbot can complete the HTTP-01 challenge.
#   2. Run `certbot --nginx -d automail.example.com`. Certbot rewrites this
#      file with the certificate paths and the HTTP->HTTPS redirect.
#
# Replace every occurrence of automail.example.com with your own domain.
# ---------------------------------------------------------------------------

# The dashboard makes bursts of small API calls (bulk confirm, feedback), so
# the general zone is generous; the login route gets its own tight one.
limit_req_zone $binary_remote_addr zone=automail_api:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=automail_login:10m rate=5r/m;

upstream automail_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: ACME challenge + redirect to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name automail.example.com;

    # Certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Comment this out during the first Certbot run.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name automail.example.com;

    # Paths written by `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/automail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automail.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Defence in depth for the middleware login gate (CVE-2025-29927): the
    # header must never arrive from a client.
    proxy_set_header x-middleware-subrequest "";

    # --- Limits ------------------------------------------------------------
    # No uploads; the largest body is a bulk action with a few hundred ids.
    client_max_body_size 2M;
    client_body_timeout  30s;

    # A manual run returns immediately and is polled, but a Gemini-backed
    # "regenerate learned notes" call can take most of a minute.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # --- Static assets: immutable, cache hard ------------------------------
    location /_next/static/ {
        proxy_pass http://automail_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Login: brute-force protection -------------------------------------
    location = /api/auth/login {
        limit_req zone=automail_login burst=5 nodelay;

        proxy_pass http://automail_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header x-middleware-subrequest "";
    }

    # --- API: rate limited -------------------------------------------------
    location /api/ {
        limit_req zone=automail_api burst=60 nodelay;

        proxy_pass http://automail_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header x-middleware-subrequest "";

        proxy_buffering off;
    }

    # --- Application -------------------------------------------------------
    location / {
        proxy_pass http://automail_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header x-middleware-subrequest "";

        proxy_cache_bypass $http_upgrade;
    }
}
